<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sterling Aquatics — Swimming Lessons &amp; First Aid Training, Toronto</title><meta name="description" content="Personalized swimming lessons and Standard First Aid + CPR-C training for individuals, families and groups in Toronto."><link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png"><meta name="theme-color" content="#071523"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.min.js"></script><script src="ds-bundle.js"></script><script src="content/business.js"></script><style>html,body{height:auto}</style></head><body>
<div id="root"></div>
<script type="text/babel" src="SiteHeader.js"></script>
<script type="text/babel" src="SiteFooter.js"></script>
<script type="text/babel" src="SiteForms.js"></script>
<script type="text/babel" src="SiteHome.js"></script>
<script type="text/babel" src="SiteSwim.js"></script>
<script type="text/babel" src="SiteFirstAid.js"></script>
<script type="text/babel" src="SiteAbout.js"></script>
<script type="text/babel">
/* Route table.
   Deliberately absent:
     · Resources — deferred, see content/business.js › deferred.resources
     · swim-instructors — deferred, see content/business.js › deferred.instructors */
const ROUTES = {
  home: () => window.Home,
  swim: () => window.SwimOverview,
  "swim-locations": () => window.SwimLocations,
  "swim-pricing": () => window.SwimPricing,
  "swim-booking": () => window.SwimBooking,
  firstaid: () => window.FirstAidAbout,
  "firstaid-individual": () => window.FirstAidIndividual,
  "firstaid-group": () => window.FirstAidGroup,
  "firstaid-inquiry": () => window.FirstAidInquiry,
  about: () => window.About,
  contact: () => window.Contact,
  cancellation: () => window.CancellationPolicy,
  privacy: () => window.PrivacyPolicy,
  accessibility: () => window.Accessibility,
};
const NO_BAND = ["swim-booking", "firstaid-inquiry", "privacy", "accessibility", "cancellation"];
function App(){
  const [page,setPage]=React.useState("home");
  const go=(id)=>{
    if(!ROUTES[id]){console.warn("Unknown route:",id);return;}
    setPage(id);window.scrollTo({top:0,behavior:"instant"});
  };
  const Screen=(ROUTES[page]||ROUTES.home)();
  return (<div className="site">
    <Header page={page} onNavigate={go}/>
    <main><Screen onNavigate={go}/></main>
    {NO_BAND.indexOf(page)===-1?<CtaBand onNavigate={go}/>:null}
    <Footer onNavigate={go}/>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
